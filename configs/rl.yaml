# One shared configuration for GRPO and SA-GRPO; train_rl.sh toggles weighting only.
data:
  train_files: ${oc.env:RL_TRAIN_FILE}
  val_files: ${oc.env:RL_VAL_FILE}
  prompt_key: prompt
  answer_key: reward_ground_truth
  image_key: images
  max_prompt_length: 2048
  max_response_length: 1024
  rollout_batch_size: 64
  mini_rollout_batch_size: 8
  val_batch_size: 1
  shuffle: true
  seed: 42
  min_pixels: 1024
  max_pixels: 262144
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 8

worker:
  actor:
    strategy: fsdp
    global_batch_size: 16
    micro_batch_size_per_device_for_update: 2
    micro_batch_size_per_device_for_experience: 2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_dual: 0.0
    loss_avg_mode: token
    loss_type: default
    ppo_epochs: 1
    padding_free: true
    dynamic_batching: true
    model:
      model_path: ${oc.env:SFT_MODEL_PATH}
      tokenizer_path: ${oc.env:SFT_MODEL_PATH}
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: true
    optim:
      lr: 1.0e-5
      strategy: adamw
      weight_decay: 0.01
      lr_warmup_ratio: 0.1
    fsdp:
      enable_full_shard: true
      mp_param_dtype: bf16
    offload:
      offload_params: true
      offload_optimizer: true
  ref:
    padding_free: true
    dynamic_batching: true
    micro_batch_size_per_device_for_experience: 2
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      mp_param_dtype: bf16
  reward:
    reward_type: batch
    reward_function: ${oc.env:MEDSAGE_ROOT}/rewards/combined_reward.py:compute_score
    reward_function_kwargs:
      accuracy_weight: 0.6
      iou_weight: 0.3
      format_weight: 0.1
  rollout:
    seed: 42
    n: 6
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    dtype: bf16
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.55
    max_model_len: 3072
    max_num_batched_tokens: 8192
    enable_chunked_prefill: false

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.03
  kl_type: fixed
  stage_aware_grpo: true
  sa_alpha: 1.0
  sa_stage_gamma: 1.25
  sa_stage_mix: 0.25
  sa_stage_min_multiplier: 0.85
  sa_stage_max_multiplier: 1.15
  sa_outcome_aware_credit: true
  sa_use_l_divergence: false
  sa_component_advantages: false
  sa_min_weight: 1.0
  sa_max_weight: 2.0

trainer:
  total_epochs: 2
  max_steps: null
  project_name: MEDSAGE
  experiment_name: sagrpo
  logger: [console]
  nnodes: 1
  n_gpus_per_node: 4
  val_freq: -1
  val_before_train: false
  save_freq: 100
  save_limit: 2
  save_model_only: false
  save_checkpoint_path: ${oc.env:OUTPUT_DIR}
  find_last_checkpoint: false
